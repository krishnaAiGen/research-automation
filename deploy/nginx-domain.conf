# Password-protected front door for a domain you own.
#
#   sudo cp deploy/nginx-domain.conf /etc/nginx/conf.d/research-automation.conf
#   sudo sed -i 's/your.domain/outreach.example.com/' /etc/nginx/conf.d/research-automation.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d outreach.example.com
#
# certbot rewrites this file in place to add the certificate and the 80->443
# redirect. Unlike the Funnel variant this one does need ports 80 and 443 open
# in the security group — but still never 3004.
server {
    listen 80;
    server_name your.domain;

    location / {
        auth_basic           "Research Outreach";
        auth_basic_user_file /etc/nginx/.htpasswd-research;

        # The app, published by docker compose on the host.
        proxy_pass         http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # A batch runs for minutes or hours. Without this nginx cuts it off at
        # 60s and the UI sees a failed request mid-send.
        proxy_read_timeout 300s;
    }
}
