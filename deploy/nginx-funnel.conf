# Password-protected front door for Tailscale Funnel.
#
#   sudo cp deploy/nginx-funnel.conf /etc/nginx/conf.d/research-automation.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Funnel connects to 127.0.0.1:8080; the internet never reaches this port
# directly, and Tailscale terminates TLS over its own relays. Nothing needs
# opening in the security group.
server {
    listen 127.0.0.1:8080;

    location / {
        auth_basic           "Research Outreach";
        auth_basic_user_file /etc/nginx/.htpasswd-research;

        # The app, published by docker compose on the host.
        proxy_pass         http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Funnel has already terminated TLS by the time the request arrives.
        proxy_set_header   X-Forwarded-Proto https;

        # A batch runs for minutes or hours. Without this nginx cuts it off at
        # 60s and the UI sees a failed request mid-send.
        proxy_read_timeout 300s;
    }
}
